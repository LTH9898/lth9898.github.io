name: Notion sync

# Pulls published pages out of the Notion notes database and commits them as
# posts. Pushing to main is what makes them live -- GitHub Pages rebuilds the
# site on its own from there.
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Rewrite every published post, even unchanged ones'
        type: boolean
        default: false
  schedule:
    # 06:00 UTC daily (15:00 KST).
    - cron: '0 6 * * *'

# Only one sync at a time, or two runs race on the same push.
concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync posts from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python3 tools/notion_sync.py \
            ${{ inputs.force && '--force' || '' }}

      - name: Commit any changes
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # git add errors on a path that has never existed, which is the case
          # until the first post syncs.
          mkdir -p _posts images/blog
          git add -A _posts images/blog
          if git diff --cached --quiet; then
            echo 'no post changes'
            exit 0
          fi
          git commit -m 'Sync blog posts from Notion'
          git push
