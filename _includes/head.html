<head>
  <link rel="shortcut icon" href="{{ '/images/logo.png' | relative_url }}">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} &middot; {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="stylesheet" href="{{ '/css/fa6-all.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/fa6-local-fonts.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/blog.css' | relative_url }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="content-type" content="text/html; charset=utf-8">
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% if page.keywords %}<meta name="keywords" content="{{ page.keywords }}">{% endif %}
  {% feed_meta %}
  <script src="{{ '/js/jquery.min.js' | relative_url }}"></script>
  <script src="{{ '/js/jquery.scrollzer.min.js' | relative_url }}"></script>
  <script src="{{ '/js/jquery.scrolly.min.js' | relative_url }}"></script>
  <script src="{{ '/js/skel.min.js' | relative_url }}"></script>
  <script src="{{ '/js/skel-layers.min.js' | relative_url }}"></script>
  <script src="{{ '/js/init.js' | relative_url }}"></script>
  <noscript>
    <link rel="stylesheet" href="{{ '/css/skel.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/css/style-xlarge.css' | relative_url }}">
  </noscript>
</head>
